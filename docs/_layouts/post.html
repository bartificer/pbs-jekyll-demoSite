---
layout: default
---
<div class="post-heading mb-5">
  <h1 class="display-1 mb-0">{{ page.title }}</h1>
  <h2 class="text-muted fw-light d-flex justify-content-start align-items-center">
    <span>{{ site.meta.author }} — {{ page.date | date: "%B %d, %Y" }}</span>
    {%- if page.tags %}
    <span class="ms-4">
      {% for tag in page.tags %}
      <span class="badge bg-info-subtle text-dark rounded-pill fs-6 fw-light">🏷️ {{ tag | capitalize }}</span>
      {% endfor %}
    </span>
    {%- endif %}
  </h2>
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb" style="--bs-breadcrumb-divider: '>';">
      <li class="breadcrumb-item"><a href="{{ '/blog' | relative_url }}">Blog</a></li>
      <li class="breadcrumb-item">{{ page.categories | first | capitalize }}</li>
    </ol>
    
  </nav>
</div>

<div class="post-body">
  {{ content }}
</div>
